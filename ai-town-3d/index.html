<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小镇 · 第三维</title></head><body><div id="app"><canvas id="world" aria-label="可拖动旋转的三维小镇"></canvas><header><div class="brand">◈ <span>小镇<span class="muted"> / 第三维</span></span></div><div class="badge" id="source">演示世界 · 非真实存档</div><button id="settings">连接世界 ↗</button></header><section class="intro"><div class="eyebrow">A WORLD WITH A LIFE OF ITS OWN</div><h1>换个角度，<br>看见小镇。</h1><p>街巷之间，每个人都有自己的故事。</p><div class="stats"><div><strong id="day">01</strong><span>模拟日</span></div><div><strong id="count">8</strong><span>在世居民</span></div><div><strong id="memories">—</strong><span>长期记忆</span></div></div></section><aside><div class="panel-title">居民档案 <span>RESIDENT</span></div><div id="resident"></div><div class="panel-title events-title">小镇动态 <span>CHRONICLE</span></div><div id="events"></div></aside><footer><div>拖动旋转 · 滚轮缩放 · 右键平移 · 点击居民</div><nav><button id="pause">暂停演示移动</button><button id="night">夜晚模式</button><button id="reset">重置视角</button></nav></footer><div id="notice" role="status">自由探索 · 场景为全新 3D 布局</div><dialog id="connect"><h2>连接你的世界</h2><p>只读展示，不启动模拟、不修改数据库。观察站没有坐标信息时，居民位置由展示层生成。</p><label>Convex 后端地址<input id="endpoint" placeholder="http://127.0.0.1:3210"></label><label>世界 ID<input id="worldId" placeholder="原世界的 worldId"></label><button id="fetch">读取观察站</button><label class="file-label">或导入 observatory:overview 导出的 JSON<input type="file" id="import" accept="application/json,.json"></label><p id="error" role="alert"></p><div class="actions"><button id="demo">返回演示</button><button id="close">关闭</button></div></dialog></div><script type="module" src="/src/main.js"></script></body></html>
